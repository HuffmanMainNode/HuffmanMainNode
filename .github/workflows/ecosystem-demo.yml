name: ecosystem-demo

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/checkout@v7
        with:
          repository: HuffmanMainNode/Open-Intelligence-Exchange
          ref: main
          path: vendor/oix
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: HuffmanMainNode/-Open-Swarm
          ref: main
          path: vendor/open-swarm
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: HuffmanMainNode/Halloween-OSINT-2026
          ref: main
          path: vendor/halloween-osint
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: HuffmanMainNode/Huffman-Cyber-Observatory
          ref: main
          path: vendor/hco
          persist-credentials: false
      - run: python -m pip install --upgrade pip pytest
      - run: python -m pip install -e vendor/oix -e vendor/open-swarm -e vendor/halloween-osint -e vendor/hco
      - run: python -m pytest -q
      - run: python examples/ecosystem_demo.py
