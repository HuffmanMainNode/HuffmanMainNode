name: ecosystem-demo

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/checkout@v7
        with:
          repository: HuffmanMainNode/Open-Intelligence-Exchange
          ref: 8c25c3b014eddaf074d5c86f0244e22140617728
          path: vendor/oix
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: HuffmanMainNode/-Open-Swarm
          ref: 677df8a085907761d9201a94bcddac156a7d1a23
          path: vendor/open-swarm
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: HuffmanMainNode/Halloween-OSINT-2026
          ref: be84ebb5aeb97ed2d891151d613d36f95dd4ddd8
          path: vendor/halloween-osint
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: HuffmanMainNode/Huffman-Cyber-Observatory
          ref: 273dcbe03ea634907bc6570f2dee9bdc2c8b4fdc
          path: vendor/hco
          persist-credentials: false
      - run: python -m pip install --upgrade pip pytest ruff bandit
      - run: python -m pip install -e vendor/oix -e vendor/open-swarm -e vendor/halloween-osint -e vendor/hco
      - run: ruff check examples tests
      - run: bandit -q -r examples
      - run: python -m pytest -q tests
      - run: python examples/ecosystem_demo.py
